{% if mode_label %}{{ _(mode_label) }}{% for p in cited %} · <a class="mono" href="/w/{{ wiki_id }}/pages/{{ p }}" title="{{ _('Open the page cited in the answer') }}">{{ p }}</a>{% endfor %}{% if tokens %} · <span class="tokens" title="{{ _('input %(input)s · output %(output)s', input=tokens.input, output=tokens.output) }}">{{ _('%(turn)s / %(conversation)s tokens', turn=tokens.turn, conversation=tokens.conversation) }}</span>{% endif %}{% endif %}

<dialog class="dataset" aria-labelledby="dataset-title">
  <header class="dataset-head">
    <h2 id="dataset-title" class="mono">{% if tables|length == 1 %}{{ tables[0].path }}{% else %}{{ _("Datasets that hold “%(name)s”", name=name) }}{% endif %}</h2>
    <button class="btn dataset-close" type="button" aria-label="{{ _('Close the dataset') }}" title="{{ _('Close the dataset') }}" onclick="this.closest('dialog').close()">×</button>
  </header>
  <div class="dataset-body">
    {% for t in tables %}
    {% include "_dataset_table.html" %}
    {% endfor %}
  </div>
  <footer class="dataset-actions">
    <button class="btn" type="button" onclick="this.closest('dialog').close()" title="{{ _('Close the dataset') }}">{{ _("Close") }}</button>
  </footer>
</dialog>

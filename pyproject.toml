[project]
name = "llmwiki"
version = "0.1.0"
description = "A local-first wiki that ingests your documents, builds a structured knowledge base, and lets you read and chat with it — Marimo apps over SQLite/FTS5, no cloud required."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Claudio Grasso" }]
keywords = ["marimo", "wiki", "rag", "llm", "knowledge-base", "sqlite", "fts5"]

dependencies = [
    # marimo apps
    "marimo>=0.23.4",
    "openai>=1.0.0",
    "python-dotenv",
    "pydantic-settings",
    "aiosqlite",
    "opendataloader-pdf",
    # test
    "playwright>=1.40.0",
    "pytest>=9.0.0",
    "pydantic-ai>=1.97.0",
    "pytest-asyncio>=1.3.0",
    "anywidget>=0.11.0",
    "traitlets>=5.15.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Clod/llmwiki-marimo"
Repository = "https://github.com/Clod/llmwiki-marimo"
Issues = "https://github.com/Clod/llmwiki-marimo/issues"

[tool.ruff]
exclude = [".trellis", ".venv", ".claude", ".agent", "marimo/prototypes", "rechunk_all.py"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

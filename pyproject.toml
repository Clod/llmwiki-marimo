[project]
name = "llmwiki"
version = "0.4.0"
description = "A local-first wiki that ingests your documents, builds a structured knowledge base, and lets you read and chat with it — Marimo apps over SQLite/FTS5, no cloud required."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Claudio Grasso" }]
keywords = ["marimo", "wiki", "rag", "llm", "knowledge-base", "sqlite", "fts5"]

dependencies = [
    "marimo>=0.23.4",
    "openai>=1.0.0",
    "python-dotenv",
    "pydantic-settings",
    "aiosqlite",
    "opendataloader-pdf",
    "pydantic-ai>=1.97.0",
    "anywidget>=0.11.0",
    "traitlets>=5.15.0",
    "pyyaml>=6.0",
    "snowballstemmer>=3.0",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/Clod/llmwiki-marimo"
Repository = "https://github.com/Clod/llmwiki-marimo"
Issues = "https://github.com/Clod/llmwiki-marimo/issues"

[dependency-groups]
dev = [
    "playwright>=1.40.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
]
web = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.46.0",
    "sse-starlette>=3.4.4",
    "markdown>=3.10.2",
    "python-multipart>=0.0.28",
    "nh3>=0.3",
    "babel>=2.17.0",
]

[tool.ruff]
exclude = [".trellis", ".venv", ".claude", ".agent", "marimo/prototypes"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

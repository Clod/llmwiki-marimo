[project]
name = "llmwiki"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # marimo apps
    "marimo>=0.23.4",
    "openai>=1.0.0",
    "python-dotenv",
    "pydantic-settings",
    "aiosqlite",
    "opendataloader-pdf",
    # test
    "playwright>=1.40.0",
    "pytest>=9.0.0",
    "pydantic-ai>=1.97.0",
    "pytest-asyncio>=1.3.0",
    "anywidget>=0.11.0",
    "traitlets>=5.15.0",
    "ruff>=0.9.0",
]

[tool.ruff]
exclude = [".trellis", ".venv", ".claude", ".agent", "marimo_new/prototypes", "rechunk_all.py"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

# Base list of the collection expressions in English: a question that contains one is
# about the wiki as a whole (node Q9). A wiki takes this list while its
# wiki_config.toml has no `[intent] collection`; the first edit from the Vocabulary
# tab writes the whole list into the wiki. An expression matches at the start of a
# word of the question, without case.
collection = [
    "this wiki", "the wiki", "each", "all the", "every",
    "what is in", "what's in", "how many", "in common", "list the",
]
